# Size-optimizing codegen flags for release binaries on aarch64 macOS.
# Verified behavior-preserving: 102 tests pass, binary runs (see .auto/log.jsonl).
#
# - machine outliner: factors repeated aarch64 instruction sequences (prologue/
#   epilogue, constant loads) into shared out-of-line functions. Saves ~32 KB.
#   -Oz does NOT enable this late pass by default (exp #21).
#
# Evaluated and rejected (finalize review, 2026-08-31):
# - "-C", "link-arg=-Wl,-no_pie" — deterministic A/B shows it saves 16 KB, but
#   NOT by disabling ASLR (the MH_PIE flag stays; ld prints "ignored for arm64").
#   It works by suppressing the __DATA_CONST segment, so __got/__const stay in
#   a writable __DATA segment at runtime (no post-fixup read-only lockdown).
#   Keeping the platform hardening feature is worth the 16 KB (0.8%).

# Hide aws-lc (BoringSSL) C function visibility: the static lib's ~500 crypto
# API symbols are currently exported in the LC_DYLD_EXPORTS_TRIE (17,912 B),
# but nothing external links against this executable — they are dead metadata.
# -fvisibility=hidden keeps them internally linkable (Rust FFI calls resolve
# within the same image) while removing them from the export trie. Unlike
# -no_exported_symbols (which broke proc-macro builds), this only touches the
# aws-lc C compile. -Oz pinned so the C code stays size-optimized.
# Compile the aws-lc (BoringSSL) C with Apple's CommandLineTools clang + -flto.
# Apple clang's -flto IR LTOs ~16 KB smaller through ld64's libLTO than the
# nix clang 21.1.8 IR (verified A/B: 2076 -> 2060 KB, behavior-preserving -
# same C source, same -Oz/-flto; -fno-stack-check makes Apple clang match the
# nix clang behavior of emitting no __chkstk stack-probe calls, which the nix
# libLTO cannot consume from Apple bitcode: 'Unsupported stack probing method').
[env]
CC = { value = "/Users/dok4ever/Project/Unknown/.cargo/cc-wrap.sh", force = true }
CXX = { value = "/Library/Developer/CommandLineTools/usr/bin/clang++", force = true }
CFLAGS = "-Oz -fvisibility=hidden -flto -fno-stack-check"

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "llvm-args=-enable-machine-outliner=always",
    # Machine-outline the C code too: with CFLAGS=-flto the aws-lc BoringSSL
    # codegen happens inside ld64's link-time LTO, which does NOT enable the
    # machine outliner by default (same as -Oz clang, exp #21). Passing the
    # LLVM option through ld64's -mllvm outlines the surviving C code as well.
    "-C", "link-arg=-Wl,-mllvm,-enable-machine-outliner=always",
]
