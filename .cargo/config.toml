# Size-optimizing codegen flags for release binaries on aarch64 macOS.
# Verified behavior-preserving: 102 tests pass, binary runs (see .auto/log.jsonl).
#
# The size-optimizing compiler/linker setup (Apple CommandLineTools clang for the
# aws-lc C compile, Apple ld64 for the final link, their -flto CFLAGS, and the
# devShell libiconv search path) is NOT hardcoded here. Those are machine-specific
# and are injected by the nix devShell environment (see flake.nix), which resolves
# every path dynamically. This file only keeps flags that are safe across every
# environment: a plain `cargo build --release` outside the nix devShell still
# builds (just without the size optimization).
#
# - machine outliner: factors repeated aarch64 instruction sequences (prologue/
#   epilogue, constant loads) into shared out-of-line functions. Saves ~32 KB.
#   -Oz does NOT enable this late pass by default (exp #21).
#
# Evaluated and rejected (finalize review, 2026-08-31):
# - "-C", "link-arg=-Wl,-no_pie" — deterministic A/B shows it saves 16 KB, but
#   NOT by disabling ASLR (the MH_PIE flag stays; ld prints "ignored for arm64").
#   It works by suppressing the __DATA_CONST segment, so __got/__const stay in
#   a writable __DATA segment at runtime (no post-fixup read-only lockdown).
#   Keeping the platform hardening feature is worth the 16 KB (0.8%).

# The Apple clang/ld64 size optimization was historically provided by the [env]
# block and the `linker =` below (see git history). Since the config migration it
# comes from the nix devShell environment variables (CC/CXX/CFLAGS and
# CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER, see flake.nix); build.rs translates
# MYAGENT_LIBICONV_LIB_DIR into a rustc link arg for ld64.
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "llvm-args=-enable-machine-outliner=always",
]
